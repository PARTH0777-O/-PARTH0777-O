<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="60%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0D1526"/>
    </linearGradient>
    <linearGradient id="bracket" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7CFFCB"/>
      <stop offset="100%" stop-color="#4FD1FF"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7CFFCB" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7CFFCB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7CFFCB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7CFFCB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7CFFCB" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#1C2740"/>
    </pattern>
    <clipPath id="clip">
      <rect width="1200" height="340" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>

    <!-- constellation / node network, right side -->
    <g stroke="#233252" stroke-width="1.4" opacity="0.9">
      <line x1="760" y1="90" x2="880" y2="60"/>
      <line x1="880" y1="60" x2="1010" y2="95"/>
      <line x1="880" y1="60" x2="930" y2="170"/>
      <line x1="930" y1="170" x2="1010" y2="95"/>
      <line x1="930" y1="170" x2="1060" y2="200"/>
      <line x1="1010" y1="95" x2="1120" y2="130"/>
      <line x1="1120" y1="130" x2="1060" y2="200"/>
      <line x1="1060" y1="200" x2="990" y2="255"/>
      <line x1="930" y1="170" x2="820" y2="220"/>
      <line x1="820" y1="220" x2="990" y2="255"/>
      <line x1="1120" y1="130" x2="1150" y2="240"/>
    </g>
    <g>
      <circle cx="760" cy="90" r="4" fill="#3A4B6E"/>
      <circle cx="1010" cy="95" r="4" fill="#3A4B6E"/>
      <circle cx="1120" cy="130" r="4" fill="#3A4B6E"/>
      <circle cx="820" cy="220" r="4" fill="#3A4B6E"/>
      <circle cx="1060" cy="200" r="4" fill="#3A4B6E"/>
      <circle cx="990" cy="255" r="4" fill="#3A4B6E"/>
      <circle cx="1150" cy="240" r="3" fill="#3A4B6E"/>

      <!-- highlighted / "active" nodes -->
      <circle cx="880" cy="60" r="18" fill="url(#nodeGlow)"/>
      <circle cx="880" cy="60" r="5" fill="#7CFFCB"/>
      <circle cx="930" cy="170" r="22" fill="url(#nodeGlow)"/>
      <circle cx="930" cy="170" r="6" fill="#7CFFCB">
        <animate attributeName="r" values="5;7;5" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- vertical scan line sweeping across the banner -->
    <rect x="-40" y="0" width="40" height="340" fill="url(#scan)">
      <animate attributeName="x" values="-40;1240" dur="5.5s" repeatCount="indefinite"/>
    </rect>

    <!-- left content block -->
    <text x="70" y="108" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="20" fill="#7CFFCB" letter-spacing="3">
      FULL-STACK DEVELOPER · AI/NLP ENGINEER
    </text>

    <text x="68" y="172" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="56" font-weight="700">
      <tspan fill="url(#bracket)">&lt;</tspan><tspan fill="#F3F6FB">Parth Patel</tspan><tspan fill="url(#bracket)"> /&gt;</tspan>
    </text>

    <text x="70" y="212" font-family="Segoe UI, Inter, sans-serif" font-size="19" fill="#9FB1CC">
      I build things that read data and make sense of it —
    </text>
    <text x="70" y="240" font-family="Segoe UI, Inter, sans-serif" font-size="19" fill="#9FB1CC">
      resume parsers, call-QA scoring, AI companions, and the APIs behind them.
    </text>

    <!-- tag pills -->
    <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="14" fill="#0A0F1E">
      <rect x="70" y="264" width="76" height="28" rx="14" fill="#7CFFCB"/>
      <text x="86" y="282">React</text>

      <rect x="156" y="264" width="72" height="28" rx="14" fill="#4FD1FF"/>
      <text x="170" y="282">Flask</text>

      <rect x="238" y="264" width="98" height="28" rx="14" fill="#7CFFCB"/>
      <text x="252" y="282">FastAPI</text>

      <rect x="346" y="264" width="106" height="28" rx="14" fill="#4FD1FF"/>
      <text x="360" y="282">MongoDB</text>

      <rect x="462" y="264" width="66" height="28" rx="14" fill="#7CFFCB"/>
      <text x="477" y="282">NLP</text>
    </g>

    <rect x="70" y="298" width="46" height="3" rx="1.5" fill="url(#bracket)"/>
  </g>
</svg>
